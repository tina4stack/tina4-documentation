name: Link Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Audit internal links
        run: python3 scripts/audit-links.py --strict --strict-anchors
        # Both flags on: gates the merge on missing files, missing images,
        # AND stale anchors. Anchor count is 0 across the docs as of the
        # cross-book sync rewriter landing — tightening here so any new
        # broken anchor blocks the build before it reaches main.

      - name: Audit feature catalog facts
        run: python3 scripts/audit-feature-catalog.py
